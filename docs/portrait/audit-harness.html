<!doctype html><html><head><meta charset="utf-8"><title>Portrait layout audit</title><style>body{margin:0;background:#091b19;color:#fff;font:14px Arial}header{padding:12px;display:flex;gap:16px;align-items:center}select{padding:8px;background:#25463b;color:white}iframe{display:block;border:0;margin:0 12px 12px;box-shadow:0 0 0 1px #60806c}small{color:#a9bfb5}</style></head><body><header><b>Portrait layout audit</b><label>Viewport <select id="size"><option>390 × 844</option><option>320 × 568</option><option>360 × 640</option><option>375 × 667</option><option>430 × 932</option><option>768 × 1024</option></select></label><small>Internal preview only</small><label>Kartu <select id="cards"><option>13</option><option>5</option><option>3</option><option>2</option><option>1</option></select></label><button id="load">Muat skenario</button><label>Keadaan <select id="scenario"><option value="hand">Kartu di tangan</option><option value="pass">Pass ketiga</option><option value="loss">Lawan satu kartu</option><option value="combo">Lima kartu</option><option value="fresh">Ronde baru</option></select></label><output id="motion">Belum diuji</output><output id="audio">Audio: belum dibuka</output></header><iframe title="Meja portrait" src="/big-two/portrait" width="390" height="844"></iframe><script>document.querySelector('select').addEventListener('change',e=>{const [w,h]=e.target.value.split(' × ');const f=document.querySelector('iframe');f.width=w;f.height=h;});const cases={"1":{"version":"tekad-big-two-1","hands":[[0],[2,4,7,9,14,19,27,31,35,38,39,43,51],[1,6,11,16,21,24,28,32,36,44,45,47,48],[3,8,13,18,20,25,26,29,30,37,40,41,49]],"played":[5,10,12,15,17,22,23,33,34,42,46,50],"turn":0,"table":null,"owner":null,"passes":0,"opening":false,"winner":null,"history":[],"sequence":0,"trick":1},"2":{"version":"tekad-big-two-1","hands":[[0,5],[2,4,7,9,14,19,27,31,35,38,39,43,51],[1,6,11,16,21,24,28,32,36,44,45,47,48],[3,8,13,18,20,25,26,29,30,37,40,41,49]],"played":[10,12,15,17,22,23,33,34,42,46,50],"turn":0,"table":null,"owner":null,"passes":0,"opening":false,"winner":null,"history":[],"sequence":0,"trick":1},"3":{"version":"tekad-big-two-1","hands":[[0,5,10],[2,4,7,9,14,19,27,31,35,38,39,43,51],[1,6,11,16,21,24,28,32,36,44,45,47,48],[3,8,13,18,20,25,26,29,30,37,40,41,49]],"played":[12,15,17,22,23,33,34,42,46,50],"turn":0,"table":null,"owner":null,"passes":0,"opening":false,"winner":null,"history":[],"sequence":0,"trick":1},"5":{"version":"tekad-big-two-1","hands":[[0,5,10,12,15],[2,4,7,9,14,19,27,31,35,38,39,43,51],[1,6,11,16,21,24,28,32,36,44,45,47,48],[3,8,13,18,20,25,26,29,30,37,40,41,49]],"played":[17,22,23,33,34,42,46,50],"turn":0,"table":null,"owner":null,"passes":0,"opening":false,"winner":null,"history":[],"sequence":0,"trick":1},"13":{"version":"tekad-big-two-1","hands":[[0,5,10,12,15,17,22,23,33,34,42,46,50],[2,4,7,9,14,19,27,31,35,38,39,43,51],[1,6,11,16,21,24,28,32,36,44,45,47,48],[3,8,13,18,20,25,26,29,30,37,40,41,49]],"played":[],"turn":0,"table":null,"owner":null,"passes":0,"opening":false,"winner":null,"history":[],"sequence":0,"trick":1}};
document.querySelector('#load').onclick=()=>{const scenario=document.querySelector('#scenario').value;let g=JSON.parse(JSON.stringify(cases[document.querySelector('#cards').value]));if(scenario==='pass'){g=JSON.parse(JSON.stringify(cases['13']));g.hands[0]=g.hands[0].filter(c=>c!==0);g.played=[0];g.table={cards:[0],kind:'single',size:1,tier:0,key:[0]};g.owner=1;g.passes=2;g.sequence=3;g.history=[{seat:1,cards:[0],kind:'single',id:1,newTrick:false},{seat:2,cards:[],kind:'pass',id:2,newTrick:false},{seat:3,cards:[],kind:'pass',id:3,newTrick:false}];}if(scenario==='loss'){g=JSON.parse(JSON.stringify(cases['13']));g.played=g.hands[1].slice(1);g.hands[1]=g.hands[1].slice(0,1);g.turn=1;}if(scenario==='combo'){g=JSON.parse(JSON.stringify(cases['13']));const cards=[0,4,8,12,16],pool=Array.from({length:52},(_,i)=>i).filter(c=>!cards.includes(c));g.hands=[cards,...Array.from({length:3},(_,i)=>pool.slice(i*13,i*13+13))];g.played=pool.slice(39);}if(scenario==='fresh')localStorage.removeItem('tekad-capsa-portrait-trial-v1');else localStorage.setItem('tekad-capsa-portrait-trial-v1',JSON.stringify(g));document.querySelector('iframe').src='/big-two/portrait';};
const frame=document.querySelector('iframe');
frame.addEventListener('load',()=>{frame.contentDocument.addEventListener('click',e=>{if(!e.target.closest('.fp-banting'))return;let count=0,delta=0,release=0,returning=0;const start=performance.now();function sample(){const doc=frame.contentDocument,a=doc.querySelector('.fp-grip-1.fp-hand-behind'),b=doc.querySelector('.fp-grip-1.fp-thumb-front');if(a&&b){const x=a.getBoundingClientRect(),y=b.getBoundingClientRect();delta=Math.max(delta,Math.abs(x.x-y.x),Math.abs(x.y-y.y));count++;if(doc.querySelector('.fp-own-play'))release++;else if(frame.contentWindow.getComputedStyle(b).visibility==='visible')returning++;}if(performance.now()-start<1200)requestAnimationFrame(sample);else document.querySelector('#motion').textContent='Frames '+count+' | selisih '+delta.toFixed(2)+'px | lepas '+release+' | kembali '+returning;}requestAnimationFrame(sample);});});
frame.addEventListener('load',()=>{const win=frame.contentWindow,Native=win.AudioContext||win.webkitAudioContext;if(!Native)return;let sources=0;const output=document.querySelector('#audio');output.textContent='Audio: belum dibuka';win.AudioContext=class extends Native{constructor(...args){super(...args);this.addEventListener('statechange',()=>{output.textContent='Audio: '+this.state+' · sumber '+sources;});}createOscillator(){const node=super.createOscillator(),start=node.start.bind(node);node.start=(...args)=>{sources++;output.textContent='Audio: '+this.state+' · sumber '+sources;return start(...args);};return node;}createBufferSource(){const node=super.createBufferSource(),start=node.start.bind(node);node.start=(...args)=>{sources++;output.textContent='Audio: '+this.state+' · sumber '+sources;return start(...args);};return node;}};});
